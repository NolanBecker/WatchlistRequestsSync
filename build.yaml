overview: "Sync tagged Sonarr and Radarr items into per-user KefinTweaks watchlists."
description: >
  Server-side Jellyfin plugin that finds Sonarr series and Radarr movies with
  configured tags, then adds the matching Jellyfin library items into each
  enabled user's KefinTweaks watchlist using additive Jellyfin Likes updates.
category: "General"
owner: "NolanBecker"
imageUrl: ""
artifacts:
