<div id="WatchlistRequestsSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button">
    <div is="emby-scroller" class="scrollY">
        <div class="content-primary">
            <h1>Watchlist Requests Sync</h1>
            <form id="watchlistRequestsSyncForm">
                <section class="settingsSection">
                    <h2>Global Settings</h2>

                    <label class="checkboxRow" for="enablePlugin">
                        <input id="enablePlugin" type="checkbox" />
                        <span>Enable Plugin</span>
                    </label>

                    <div class="fieldGroup">
                        <label for="sonarrBaseUrl">Sonarr Base URL</label>
                        <input id="sonarrBaseUrl" type="text" autocomplete="off" spellcheck="false" />
                    </div>

                    <div class="fieldGroup">
                        <label for="sonarrApiKey">Sonarr API Key</label>
                        <input id="sonarrApiKey" type="password" autocomplete="off" spellcheck="false" />
                    </div>

                    <div class="fieldGroup">
                        <label for="sonarrTags">Sonarr Tags</label>
                        <input id="sonarrTags" type="text" autocomplete="off" spellcheck="false" />
                        <div class="hintText">Comma-separated labels or numeric tag ids.</div>
                    </div>

                    <div class="fieldGroup">
                        <label for="radarrBaseUrl">Radarr Base URL</label>
                        <input id="radarrBaseUrl" type="text" autocomplete="off" spellcheck="false" />
                    </div>

                    <div class="fieldGroup">
                        <label for="radarrApiKey">Radarr API Key</label>
                        <input id="radarrApiKey" type="password" autocomplete="off" spellcheck="false" />
                    </div>

                    <div class="fieldGroup">
                        <label for="radarrTags">Radarr Tags</label>
                        <input id="radarrTags" type="text" autocomplete="off" spellcheck="false" />
                        <div class="hintText">Comma-separated labels or numeric tag ids.</div>
                    </div>

                    <div class="fieldGroup">
                        <label for="syncIntervalMinutes">Sync Interval (minutes)</label>
                        <input id="syncIntervalMinutes" type="number" min="15" />
                    </div>

                    <label class="checkboxRow" for="dryRun">
                        <input id="dryRun" type="checkbox" />
                        <span>Dry Run</span>
                    </label>
                </section>

                <div class="buttonRow">
                    <button is="emby-button" type="button" id="testConnectionButton" class="raised button-submit block">Test Connections</button>
                    <button is="emby-button" type="button" id="previewSyncButton" class="raised button-submit block">Preview Sync</button>
                    <button is="emby-button" type="button" id="runSyncButton" class="raised button-submit block">Run Sync Now</button>
                </div>

                <section class="settingsSection">
                    <h2>Per-User Settings</h2>
                    <div id="userSettingsContainer"></div>
                </section>

                <section class="settingsSection">
                    <h2>Last Status</h2>
                    <pre id="statusOutput" class="statusOutput"></pre>
                </section>

                <button is="emby-button" type="button" id="saveButton" class="raised button-submit block">Save</button>
            </form>
        </div>
    </div>

    <style>
        #WatchlistRequestsSyncConfigPage .content-primary {
            max-width: 880px;
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        #WatchlistRequestsSyncConfigPage #watchlistRequestsSyncForm {
            display: grid;
            gap: 1.5rem;
        }

        #WatchlistRequestsSyncConfigPage .settingsSection {
            display: grid;
            gap: 1rem;
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        #WatchlistRequestsSyncConfigPage .settingsSection h2,
        #WatchlistRequestsSyncConfigPage .userCard h3,
        #WatchlistRequestsSyncConfigPage .statusOutput {
            margin: 0;
        }

        #WatchlistRequestsSyncConfigPage .fieldGroup,
        #WatchlistRequestsSyncConfigPage .userCard {
            display: grid;
            gap: 0.5rem;
        }

        #WatchlistRequestsSyncConfigPage .fieldGroup label,
        #WatchlistRequestsSyncConfigPage .checkboxRow,
        #WatchlistRequestsSyncConfigPage .userCard label {
            font-weight: 600;
        }

        #WatchlistRequestsSyncConfigPage input[type="text"],
        #WatchlistRequestsSyncConfigPage input[type="password"],
        #WatchlistRequestsSyncConfigPage input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            min-height: 2.5rem;
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            color: inherit;
        }

        #WatchlistRequestsSyncConfigPage .checkboxRow {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        #WatchlistRequestsSyncConfigPage .buttonRow {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #WatchlistRequestsSyncConfigPage .buttonRow button {
            min-width: 10rem;
        }

        #WatchlistRequestsSyncConfigPage .userCard {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 1rem 1rem 1.25rem;
            background: rgba(0, 0, 0, 0.15);
        }

        #WatchlistRequestsSyncConfigPage .statusOutput {
            min-height: 12rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 1rem;
            border-radius: 12px;
            overflow: auto;
            white-space: pre-wrap;
        }

        #WatchlistRequestsSyncConfigPage .hintText {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        #WatchlistRequestsSyncConfigPage .emptyState {
            padding: 1rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            line-height: 1.45;
        }
    </style>

    <script type="text/javascript">
        (function () {
            "use strict";

            const pluginId = "7b2cef2e-d5ea-43e2-be8e-ab2070b2d18e";
            const page = document.querySelector("#WatchlistRequestsSyncConfigPage");

            if (!page) {
                return;
            }

            function byId(id) {
                return page.querySelector("#" + id);
            }

            function createDefaultConfig() {
                return {
                    isEnabled: true,
                    sonarrBaseUrl: "",
                    sonarrApiKey: "",
                    sonarrTags: "",
                    radarrBaseUrl: "",
                    radarrApiKey: "",
                    radarrTags: "",
                    syncIntervalMinutes: 360,
                    dryRun: false,
                    users: []
                };
            }

            async function describeError(error) {
                if (error && typeof error === "object") {
                    if (typeof error.text === "function") {
                        try {
                            const text = await error.text();
                            const body = text ? text.trim() : "";
                            const prefix = error.status ? ("HTTP " + error.status) : "HTTP error";
                            return body ? (prefix + ": " + body) : prefix;
                        } catch (readError) {
                            if (error.status) {
                                return "HTTP " + error.status;
                            }
                        }
                    }

                    if (error.message) {
                        return error.message;
                    }
                }

                return String(error);
            }

            function renderUsers(users) {
                const container = byId("userSettingsContainer");
                container.innerHTML = "";

                if (!users.length) {
                    const emptyState = document.createElement("div");
                    emptyState.className = "emptyState";
                    emptyState.textContent = "No Jellyfin users were loaded. Save your settings, reload the page, or sign in with an admin account that can view users.";
                    container.appendChild(emptyState);
                    return;
                }

                users.forEach(function (user, index) {
                    const wrapper = document.createElement("div");
                    wrapper.className = "userCard";
                    wrapper.dataset.index = index.toString();
                    wrapper.innerHTML = [
                        "<h3>" + user.jellyfinUserName + "</h3>",
                        "<label>Enable Sync <input type='checkbox' data-field='isEnabled' " + (user.settings.isEnabled ? "checked" : "") + " /></label>",
                        "<label>Include Movies <input type='checkbox' data-field='includeMovies' " + (user.settings.includeMovies ? "checked" : "") + " /></label>",
                        "<label>Include Series <input type='checkbox' data-field='includeSeries' " + (user.settings.includeSeries ? "checked" : "") + " /></label>"
                    ].join("");
                    container.appendChild(wrapper);
                });
            }

            function createDefaultSettings(userId, userName) {
                return {
                    jellyfinUserId: userId,
                    jellyfinUserName: userName,
                    isEnabled: false,
                    includeMovies: true,
                    includeSeries: true
                };
            }

            function normalizeUserId(value) {
                return value || "";
            }

            function normalizeUserName(user) {
                return user.jellyfinUserName
                    || user.JellyfinUserName
                    || user.name
                    || user.Name
                    || user.username
                    || user.Username
                    || "Unknown User";
            }

            function normalizePluginUsers(users) {
                if (!Array.isArray(users)) {
                    return [];
                }

                return users.map(function (user) {
                    const userId = normalizeUserId(user.jellyfinUserId || user.JellyfinUserId);
                    if (!userId) {
                        return null;
                    }

                    const userName = normalizeUserName(user);
                    return {
                        jellyfinUserId: userId,
                        jellyfinUserName: userName,
                        settings: user.settings || user.Settings || createDefaultSettings(userId, userName)
                    };
                }).filter(Boolean);
            }

            function normalizeCoreUsers(users, existingUsersById) {
                const sourceUsers = Array.isArray(users)
                    ? users
                    : Array.isArray(users && users.Items)
                        ? users.Items
                        : Array.isArray(users && users.items)
                            ? users.items
                            : [];

                if (!sourceUsers.length) {
                    return [];
                }

                return sourceUsers.map(function (user) {
                    const userId = normalizeUserId(user.id || user.Id);
                    if (!userId) {
                        return null;
                    }

                    const userName = normalizeUserName(user);
                    const existing = existingUsersById[userId];
                    return {
                        jellyfinUserId: userId,
                        jellyfinUserName: userName,
                        settings: existing ? JSON.parse(JSON.stringify(existing.settings)) : createDefaultSettings(userId, userName)
                    };
                }).filter(Boolean);
            }

            async function fetchFallbackUsers(existingUsersById) {
                let users = await ApiClient.ajax({
                    type: "GET",
                    url: ApiClient.getUrl("Users"),
                    dataType: "json"
                });

                if (!normalizeCoreUsers(users, existingUsersById).length) {
                    users = await ApiClient.ajax({
                        type: "GET",
                        url: ApiClient.getUrl("Users/Query"),
                        dataType: "json"
                    });
                }

                return normalizeCoreUsers(users, existingUsersById);
            }

            async function fetchCurrentUserFallback(existingUsersById) {
                const currentUser = await ApiClient.getCurrentUser();
                return normalizeCoreUsers([currentUser], existingUsersById);
            }

            async function getPluginConfiguration() {
                const config = await ApiClient.ajax({
                    type: "GET",
                    url: ApiClient.getUrl("Plugins/WatchlistRequestsSync/Configuration"),
                    dataType: "json"
                });

                return Object.assign(createDefaultConfig(), config || {});
            }

            function captureUsers(existingUsers) {
                const cards = Array.from(page.querySelectorAll("#userSettingsContainer .userCard"));
                return cards.map(function (card) {
                    const original = existingUsers[parseInt(card.dataset.index, 10)];
                    const updated = JSON.parse(JSON.stringify(original.settings));

                    card.querySelectorAll("[data-field]").forEach(function (field) {
                        updated[field.dataset.field] = field.checked;
                    });

                    updated.jellyfinUserId = original.jellyfinUserId;
                    updated.jellyfinUserName = original.jellyfinUserName;
                    return updated;
                });
            }

            async function fetchUsers() {
                const pluginUsers = normalizePluginUsers(await ApiClient.getJSON(ApiClient.getUrl("Plugins/WatchlistRequestsSync/Users")));
                const existingUsersById = Object.fromEntries(pluginUsers.map(function (user) {
                    return [user.jellyfinUserId, user];
                }));

                let users = pluginUsers;
                if (!users.length) {
                    try {
                        users = await fetchFallbackUsers(existingUsersById);
                    } catch (error) {
                        console.warn("Failed to load Jellyfin users from the core endpoint.", error);
                    }
                }

                if (!users.length) {
                    try {
                        users = await fetchCurrentUserFallback(existingUsersById);
                    } catch (error) {
                        console.warn("Failed to load the current Jellyfin user.", error);
                    }
                }

                page._users = users;
                renderUsers(users);
                return users;
            }

            async function showStatus() {
                const status = await ApiClient.getJSON(ApiClient.getUrl("Plugins/WatchlistRequestsSync/Status"));
                byId("statusOutput").textContent = JSON.stringify(status, null, 2);
            }

            async function buildCurrentConfig() {
                const config = Object.assign(createDefaultConfig(), page._config || {});
                config.isEnabled = byId("enablePlugin").checked;
                config.sonarrBaseUrl = (byId("sonarrBaseUrl").value || "").trim();
                config.sonarrApiKey = byId("sonarrApiKey").value || "";
                config.sonarrTags = (byId("sonarrTags").value || "").trim();
                config.radarrBaseUrl = (byId("radarrBaseUrl").value || "").trim();
                config.radarrApiKey = byId("radarrApiKey").value || "";
                config.radarrTags = (byId("radarrTags").value || "").trim();
                config.syncIntervalMinutes = parseInt(byId("syncIntervalMinutes").value || "360", 10);
                config.dryRun = byId("dryRun").checked;
                config.users = captureUsers(page._users || []);
                return config;
            }

            async function persistCurrentConfig() {
                const config = await buildCurrentConfig();
                const savedConfig = await ApiClient.ajax({
                    type: "POST",
                    url: ApiClient.getUrl("Plugins/WatchlistRequestsSync/Configuration"),
                    contentType: "application/json",
                    data: JSON.stringify(config),
                    dataType: "json"
                });
                page._config = Object.assign(createDefaultConfig(), savedConfig || config);
                return page._config;
            }

            async function executeManualSync(endpoint) {
                const config = await buildCurrentConfig();
                const result = await ApiClient.ajax({
                    type: "POST",
                    url: ApiClient.getUrl("Plugins/WatchlistRequestsSync/" + endpoint),
                    contentType: "application/json",
                    data: JSON.stringify({ configuration: config }),
                    dataType: "json"
                });
                byId("statusOutput").textContent = JSON.stringify(result, null, 2);
            }

            async function loadPage() {
                const config = await getPluginConfiguration();
                page._config = config;
                byId("enablePlugin").checked = !!config.isEnabled;
                byId("sonarrBaseUrl").value = config.sonarrBaseUrl || "";
                byId("sonarrApiKey").value = config.sonarrApiKey || "";
                byId("sonarrTags").value = config.sonarrTags || "";
                byId("radarrBaseUrl").value = config.radarrBaseUrl || "";
                byId("radarrApiKey").value = config.radarrApiKey || "";
                byId("radarrTags").value = config.radarrTags || "";
                byId("syncIntervalMinutes").value = config.syncIntervalMinutes || 360;
                byId("dryRun").checked = !!config.dryRun;
                await fetchUsers();
                await showStatus();
            }

            byId("saveButton").addEventListener("click", async function () {
                await persistCurrentConfig();
                byId("statusOutput").textContent = "Configuration saved.";
                Dashboard.processPluginConfigurationUpdateResult();
            });

            byId("testConnectionButton").addEventListener("click", async function () {
                const result = await ApiClient.ajax({
                    type: "POST",
                    url: ApiClient.getUrl("Plugins/WatchlistRequestsSync/TestConnection"),
                    contentType: "application/json",
                    data: JSON.stringify({
                        sonarrBaseUrl: (byId("sonarrBaseUrl").value || "").trim(),
                        sonarrApiKey: byId("sonarrApiKey").value || "",
                        radarrBaseUrl: (byId("radarrBaseUrl").value || "").trim(),
                        radarrApiKey: byId("radarrApiKey").value || ""
                    }),
                    dataType: "json"
                });
                byId("statusOutput").textContent = JSON.stringify(result, null, 2);
            });

            byId("previewSyncButton").addEventListener("click", async function () {
                await executeManualSync("PreviewSync");
            });

            byId("runSyncButton").addEventListener("click", async function () {
                await executeManualSync("RunSync");
            });

            loadPage().catch(function (error) {
                describeError(error).then(function (message) {
                    byId("statusOutput").textContent = "Failed to load plugin configuration: " + message;
                });
            });
        })();
    </script>
</div>
